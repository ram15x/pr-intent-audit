# Copy to .github/workflows/pr-audit.yml in YOUR repo.
# Notes:
#  - Uses `pull_request` (not `pull_request_target`): the audit only reads the diff through the API, it never runs PR code,
#    but fork PRs get no secrets, so the judge is skipped and the job fails closed (no comment).
#  - PR text is sent to the judge provider. Free Gemini terms allow Google to train on it: public repos only.
#  - Retrieval here is lexical word overlap; its accuracy versus the trained retriever has not been measured validly yet (see docs/RESULTS.md).
name: PR Intent Audit
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # For real use pin a release tag or, better, a full commit SHA instead of @main.
      - uses: ram15x/pr-intent-audit@main
        with:
          # ask-file: .agent-prompt.md   # optional: audit against the prompt you gave the coding agent instead of the PR text
          github-token: ${{ secrets.GITHUB_TOKEN }}
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
