[project]
name = "pr-intent-audit"
version = "0.0.1"
description = "Audit whether a pull request (esp. one written by a coding agent) did what was asked, with line-level proof."
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "unidiff>=0.7", "httpx>=0.27", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
pr-audit = "pr_audit.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
pr_audit = ["web/*.html"]
